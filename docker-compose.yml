version: "3.9"

services:
  backend:
    build: ./backend
    container_name: creatormind_backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: creatormind_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  chroma_data:
  uploads:
